<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>首の負荷チェッカー</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        canvas { width: 100vw; height: 100vh; object-fit: cover; display: block; }
        video { display: none; }

        /* ======== カメラ用グリッド線（水準器） ======== */
        #gridOverlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 2;
        }

        .grid-line {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.3);
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .vert-1 { left: 33.33%; top: 0; width: 1.5px; height: 100%; }
        .vert-2 { left: 66.66%; top: 0; width: 1.5px; height: 100%; }
        .horiz-1 { top: 33.33%; left: 0; height: 1.5px; width: 100%; }
        .horiz-2 { top: 66.66%; left: 0; height: 1.5px; width: 100%; }

        /* 垂直（水平OK）になった時に緑色に発光 */
        #gridOverlay.is-level .grid-line {
            background-color: #00ff66;
            box-shadow: 0 0 8px #00ff66;
        }

        /* ======== オーバーレイUI ======== */
        .overlay-card {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            border-radius: 16px;
            padding: 15px 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 5;
        }

        .title { font-size: 14px; color: #555; margin-bottom: 5px; font-weight: bold; }
        .result-val { font-size: 32px; font-weight: 900; margin: 5px 0; color: #111; }
        .angle-val { font-size: 16px; color: #333; margin-bottom: 5px; }
        .status { font-size: 15px; font-weight: bold; margin-top: 5px; }
        
        .button-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
            width: 90%;
            justify-content: center;
        }

        button {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.1s;
            white-space: nowrap;
        }
        button:active { transform: translateY(2px) scale(0.98); }

        #switchCamBtn { background-color: rgba(0, 122, 255, 0.9); }
        #saveSnapBtn { background-color: rgba(255, 149, 0, 0.9); }

        #previewModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            z-index: 100;
            flex-direction: column;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            padding-top: env(safe-area-inset-top, 20px);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
        }

        #closePreviewBtn {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }

        .guide-text { font-size: 13px; color: #ffcc00; font-weight: bold; }

        #previewImage {
            flex-grow: 1;
            width: 100%;
            height: 0; 
            object-fit: contain; 
        }
    </style>
</head>
<body>
    
    <video id="video" playsinline></video>
    <canvas id="canvas" width="720" height="1280"></canvas>

    <!-- 水平・垂直検知用グリッド -->
    <div id="gridOverlay">
        <div class="grid-line vert-1"></div>
        <div class="grid-line vert-2"></div>
        <div class="grid-line horiz-1"></div>
        <div class="grid-line horiz-2"></div>
    </div>

    <div class="overlay-card">
        <div class="title">首への推定負荷</div>
        <div class="result-val" id="weightText">準備中...</div>
        <div class="angle-val">前傾角度: <span id="angleText">--</span>°</div>
        <div class="status" id="statusText">真横を向いてカメラに映ってください</div>
    </div>

    <div class="button-container">
        <button id="switchCamBtn">🔄 切替</button>
        <button id="saveSnapBtn">📸 撮影＆保存</button>
    </div>

    <div id="previewModal">
        <div class="modal-header">
            <button id="closePreviewBtn">✕ カメラに戻る</button>
            <span class="guide-text">長押しして「写真」に保存 👇</span>
        </div>
        <img id="previewImage" src="" alt="保存用画像">
    </div>

    <script src="app.js"></script>
</body>
</html>
