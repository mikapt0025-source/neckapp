<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>首の負荷チェッカー</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        canvas { width: 100vw; height: 100vh; object-fit: cover; display: block; }
        video { display: none; }

        /* ======== カメラ用細密グリッド線（水準器） ======== */
        #gridOverlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 2;
        }

        .grid-line {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.2);
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        /* 縦方向のライン（20%, 40%, 60%, 80%） */
        .v1 { left: 20%; top: 0; width: 1px; height: 100%; }
        .v2 { left: 40%; top: 0; width: 1px; height: 100%; }
        .v3 { left: 60%; top: 0; width: 1px; height: 100%; }
        .v4 { left: 80%; top: 0; width: 1px; height: 100%; }

        /* 横方向のライン（20%, 40%, 60%, 80%） */
        .h1 { top: 20%; left: 0; height: 1px; width: 100%; }
        .h2 { top: 40%; left: 0; height: 1px; width: 100%; }
        .h3 { top: 60%; left: 0; height: 1px; width: 100%; }
        .h4 { top: 80%; left: 0; height: 1px; width: 100%; }

        /* 垂直（85°〜95°）になった時に緑色に発光 */
        #gridOverlay.is-level .grid-line {
            background-color: #00ff66;
            box-shadow: 0 0 6px #00ff66;
        }

        /* ======== オーバーレイUI ======== */
        .overlay-card {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 15px 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 5;
        }

        .title { font-size: 13px; color: #666; margin-bottom: 3px; font-weight: bold; }
        .result-val { font-size: 32px; font-weight: 900; margin: 2px 0; color: #111; }
        .angle-val { font-size: 15px; color: #333; font-weight: bold; margin-bottom: 2px; }
        .tilt-val { font-size: 12px; color: #007aff; font-weight: bold; margin-bottom: 6px; }
        .status { font-size: 14px; font-weight: bold; }
        
        .button-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
            width: 90%;
            justify-content: center;
        }

        button {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.1s;
            white-space: nowrap;
        }
        button:active { transform: translateY(2px) scale(0.98); }

        #switchCamBtn { background-color: rgba(0, 122, 255, 0.9); }
        #saveSnapBtn { background-color: rgba(255, 149, 0, 0.9); }

        #previewModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            z-index: 100;
            flex-direction: column;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            padding-top: env(safe-area-inset-top, 20px);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
        }

        #closePreviewBtn {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }

        .guide-text { font-size: 13px; color: #ffcc00; font-weight: bold; }

        #previewImage {
            flex-grow: 1;
            width: 100%;
            height: 0; 
            object-fit: contain; 
        }
    </style>
</head>
<body>
    
    <video id="video" playsinline></video>
    <canvas id="canvas" width="720" height="1280"></canvas>

    <!-- 細密グリッドライン -->
    <div id="gridOverlay">
        <div class="grid-line v1"></div>
        <div class="grid-line v2"></div>
        <div class="grid-line v3"></div>
        <div class="grid-line v4"></div>
        <div class="grid-line h1"></div>
        <div class="grid-line h2"></div>
        <div class="grid-line h3"></div>
        <div class="grid-line h4"></div>
    </div>

    <div class="overlay-card">
        <div class="title">首への推定負荷</div>
        <div class="result-val" id="weightText">準備中...</div>
        <div class="angle-val">首の前傾角度: <span id="angleText">--</span>°</div>
        <div class="tilt-val" id="tiltText">📱 スマホ傾き: --° (目標: 90°)</div>
        <div class="status" id="statusText">真横を向いてカメラに映ってください</div>
    </div>

    <div class="button-container">
        <button id="switchCamBtn">🔄 切替</button>
        <button id="saveSnapBtn">📸 撮影＆保存</button>
    </div>

    <div id="previewModal">
        <div class="modal-header">
            <button id="closePreviewBtn">✕ カメラに戻る</button>
            <span class="guide-text">長押しして「写真」に保存 👇</span>
        </div>
        <img id="previewImage" src="" alt="保存用画像">
    </div>

    <script src="app.js"></script>
</body>
</html>
